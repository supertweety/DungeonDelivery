[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-delivery"
version = "0.1.0"
description = "An educational grid-world search tournament for Intro AI assignments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["numpy", "pandas", "matplotlib"]
visual = ["pygame>=2.5"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dungeon_delivery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
